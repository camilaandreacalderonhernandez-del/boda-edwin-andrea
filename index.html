<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b31">
<meta name="description" content="Edwin y Andrea celebran su boda. Acompáñanos en este día tan especial.">
<title>Edwin & Andrea | Nuestra boda</title>

<style>
:root {
  --azul: #101b31;
  --azul-claro: #1b2b47;
  --marfil: #fffaf0;
  --dorado: #c9a45c;
  --dorado-claro: #f0dba7;
  --texto: #f8f1e4;
  --texto-oscuro: #293147;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 15px;
}

body {
  margin: 0;
  background: var(--azul);
  color: var(--texto);
  font-family: Georgia, "Times New Roman", serif;
  text-align: center;
  overflow-x: hidden;
}

body.sin-scroll { overflow: hidden; }

button { font-family: inherit; }

p { line-height: 1.8; }

/* ===================================
   PORTADA: SOBRE DE PAPEL REAL
=================================== */

.sobre-intro {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 18px;
  overflow-y: auto;
  background:
    radial-gradient(ellipse at 50% 35%, #293b59 0%, transparent 58%),
    linear-gradient(145deg, #0b1323, #101b31 55%, #17243a);
  transition: opacity 1s ease, visibility 1s ease;
}

.sobre-intro.retirado {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.sobre-contenido {
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 0;
  animation: aparecer 1s ease both;
}

.sobre-etiqueta {
  margin: 0 0 12px;
  color: var(--dorado-claro);
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.sobre-titulo {
  margin: 0 0 8px;
  color: var(--marfil);
  font-size: clamp(28px, 7vw, 38px);
  font-weight: normal;
}

.sobre-frase {
  margin: 0 0 34px;
  color: #e9dfce;
  font-size: 15px;
  font-style: italic;
  line-height: 1.8;
}

/* Escenario del sobre */

.escenario-sobre {
  position: relative;
  width: min(88vw, 370px);
  aspect-ratio: 1.32 / 1;
  perspective: 1100px;
  filter: drop-shadow(0 22px 25px rgba(0,0,0,.4));
}

/* La tarjeta que está dentro */

.carta-detras {
  position: absolute;
  z-index: 1;
  left: 7%;
  top: 0;
  width: 86%;
  height: 91%;
  padding: 22px 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: var(--azul);
  border: 1px solid #d9c28a;
  background:
    radial-gradient(ellipse at top left, #fffef9, transparent 65%),
    linear-gradient(135deg, #fffdf7, #eee0bf);
  box-shadow:
    inset 0 0 0 5px rgba(201,164,92,.12),
    0 3px 8px rgba(0,0,0,.12);
  transition: top 1s ease, transform 1s ease;
}

.carta-detras::before {
  content: "✧";
  color: var(--dorado);
  font-size: 25px;
  margin-bottom: 8px;
}

.carta-detras strong {
  font-size: clamp(21px, 6vw, 29px);
  font-weight: normal;
}

.carta-detras span {
  margin-top: 8px;
  color: #846b3d;
  font-size: 13px;
  font-style: italic;
}

.carta-detras small {
  margin-top: 15px;
  color: #846b3d;
  font-size: 10px;
  letter-spacing: 3px;
}

/* Cuerpo del sobre */

.sobre-base {
  position: absolute;
  z-index: 2;
  inset: 13% 0 0;
  overflow: hidden;
  border: 1px solid #c6b99d;
  border-radius: 2px;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(110,90,56,.025) 0px,
      rgba(110,90,56,.025) 1px,
      transparent 1px,
      transparent 4px
    ),
    radial-gradient(ellipse at 20% 15%, #fffdf5 0%, transparent 65%),
    linear-gradient(145deg, #f6efdf, #e9ddc5 65%, #d8c9ab);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.65),
    inset 0 -10px 22px rgba(116,91,52,.08),
    0 8px 15px rgba(0,0,0,.18);
}

.sobre-base::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    linear-gradient(145deg, transparent 49.5%, rgba(119,94,54,.13) 50%, transparent 50.5%),
    linear-gradient(215deg, transparent 49.5%, rgba(119,94,54,.12) 50%, transparent 50.5%);
}

.solapa-izquierda,
.solapa-derecha,
.solapa-inferior {
  position: absolute;
  inset: 0;
}

.solapa-izquierda {
  background: linear-gradient(115deg, #f8f1e3, #e2d3b6);
  clip-path: polygon(0 0, 55% 50%, 0 100%);
  filter: drop-shadow(1px 0 1px rgba(111,87,48,.2));
}

.solapa-derecha {
  background: linear-gradient(245deg, #fbf5e8, #e1d0b0);
  clip-path: polygon(100% 0, 45% 50%, 100% 100%);
}

.solapa-inferior {
  background: linear-gradient(20deg, #d8c6a4, #f3e8d3 70%);
  clip-path: polygon(0 100%, 50% 37%, 100% 100%);
}

/* Solapa superior */

.solapa-superior {
  position: absolute;
  z-index: 5;
  top: 13%;
  left: 0;
  width: 100%;
  height: 60%;
  background:
    linear-gradient(160deg, rgba(255,255,255,.55), transparent 70%),
    linear-gradient(180deg, #f8f0df, #e4d3b2);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  transition: transform .9s ease, opacity .5s ease;
  filter: drop-shadow(0 3px 2px rgba(71,49,15,.15));
}

/* Sello de cera */

.sello-boton {
  position: absolute;
  z-index: 10;
  left: 50%;
  top: 56%;
  width: 112px;
  height: 112px;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 0;
  border: 1px solid #9c3a3c;
  border-radius: 43% 52% 47% 55% / 51% 43% 56% 47%;
  background:
    radial-gradient(ellipse at 29% 21%, rgba(255,180,159,.72), transparent 26%),
    radial-gradient(ellipse at 70% 75%, rgba(65,0,13,.55), transparent 45%),
    radial-gradient(circle at 40% 35%, #b94347, #8b1f2d 65%, #5b101e);
  color: #f8e8bb;
  box-shadow:
    0 0 0 3px rgba(110,19,29,.65),
    0 0 0 5px rgba(201,164,92,.42),
    inset 0 2px 3px rgba(255,214,189,.4),
    inset 0 -5px 8px rgba(48,0,10,.42),
    0 7px 12px rgba(0,0,0,.32);
  cursor: pointer;
  transition: transform .3s ease, opacity .4s ease, filter .3s ease;
  -webkit-tap-highlight-color: transparent;
}

.sello-boton::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(247,207,159,.55);
  border-radius: 46% 52% 43% 56% / 50% 44% 56% 47%;
  pointer-events: none;
}

.sello-boton:hover {
  filter: brightness(1.12);
  transform: translate(-50%, -50%) scale(1.05);
}

.sello-iniciales {
  font-size: 27px;
  font-style: italic;
  line-height: 1.1;
  text-shadow: 0 1px 2px rgba(52,0,0,.6);
}

.sello-adornos {
  font-size: 12px;
  letter-spacing: 3px;
}

.sello-instruccion {
  position: absolute;
  top: calc(100% + 18px);
  left: 50%;
  width: 280px;
  transform: translateX(-50%);
  color: var(--dorado-claro);
  font-size: 13px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  animation: respirar 1.8s ease-in-out infinite;
}

.sobre-intro.abriendo .solapa-superior {
  transform: rotateX(180deg);
  opacity: .25;
}

.sobre-intro.abriendo .sello-boton {
  opacity: 0;
  transform: translate(-50%, -50%) scale(1.4) rotate(-12deg);
  pointer-events: none;
}

.sobre-intro.abriendo .carta-detras {
  top: -27%;
  transform: translateY(-12%) scale(1.04);
}

/* ===================================
   CONTENIDO DE LA INVITACIÓN
=================================== */

main {
  width: 100%;
  overflow: hidden;
}

.seccion {
  position: relative;
  padding: 65px 22px;
}

.contenedor {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
}

.linea-dorada {
  width: 80px;
  height: 1px;
  margin: 23px auto;
  background: var(--dorado);
}

.etiqueta {
  color: var(--dorado-claro);
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
}

h2 {
  margin: 14px 0;
  color: var(--marfil);
  font-size: clamp(28px, 7vw, 43px);
  font-weight: normal;
  line-height: 1.25;
}

h3 {
  color: var(--dorado-claro);
  font-size: 25px;
  font-weight: normal;
  font-style: italic;
}

.promesa {
  margin-top: 7px;
  color: var(--dorado-claro);
  font-size: clamp(23px, 6vw, 30px);
  font-style: italic;
}

.versiculo {
  max-width: 520px;
  margin: 25px auto;
  color: #e9dfce;
  font-size: 16px;
  font-style: italic;
  line-height: 1.9;
}

.referencia {
  color: var(--dorado-claro);
  font-size: 12px;
  letter-spacing: 2px;
}

.foto-anillos {
  display: block;
  width: min(100%, 420px);
  max-height: 330px;
  margin: 30px auto 0;
  object-fit: cover;
  border: 1px solid var(--dorado);
  padding: 6px;
}
